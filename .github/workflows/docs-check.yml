name: 文档基线机检

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/check_docs.py', '.github/workflows/docs-check.yml']
  pull_request:
    paths: ['docs/**', 'tools/check_docs.py', '.github/workflows/docs-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行机检
        run: python3 tools/check_docs.py | tee check.log

      - name: 写入作业摘要
        if: always()
        run: |
          {
            echo '## 文档基线机检'
            echo
            echo '```'
            cat check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
